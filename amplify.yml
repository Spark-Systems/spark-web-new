# AWS Amplify build settings (a file in the repository replaces the console's).
# Amplify's console variables exist only while building; the running site
# reads server-side settings from .env.production, so the secret is written
# there first. Set SPARK_SHARED_SECRET in Amplify > Hosting > Environment
# variables, with the same value as the backend's SPARK_SHARED_SECRET.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "SPARK_SHARED_SECRET=$SPARK_SHARED_SECRET" >> .env.production
        - if [ -n "$BACKEND_URL" ]; then echo "BACKEND_URL=$BACKEND_URL" >> .env.production; fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
